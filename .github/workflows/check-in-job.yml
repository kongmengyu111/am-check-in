name: Scheduled Check-In Job

on:
  schedule:
    - cron: '1 0 * * *'  # 每天 00:01 UTC（北京时间 08:01）
  workflow_dispatch:

jobs:
  checkin-1:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
    - name: Install dependencies
      run: |
        npm install
        npm install node-fetch
    - name: Run check-in (Account 1)
      run: node _worker.js
      env:
        JC_TYPE: ${{ secrets.JC_TYPE }}
        DOMAIN: ${{ secrets.DOMAIN }}
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_ID: ${{ secrets.TG_ID }}

  checkin-2:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
    - name: Install dependencies
      run: |
        npm install
        npm install node-fetch
    - name: Run check-in (Account 2)
      run: node _worker.js
      env:
        JC_TYPE: ${{ secrets.JC_TYPE_2 }}
        DOMAIN: ${{ secrets.DOMAIN_2 }}
        USERNAME: ${{ secrets.USERNAME_2 }}
        PASSWORD: ${{ secrets.PASSWORD_2 }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_ID: ${{ secrets.TG_ID }}
